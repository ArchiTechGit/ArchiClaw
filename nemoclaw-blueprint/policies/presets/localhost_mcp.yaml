preset:
  name: localhost_mcp
  description: "Localhost MCP server access, including NetBox"

network_policies:
  localhost_mcp:
    name: localhost_mcp
    endpoints:
      # Netbox MCP server endpoint http://host.docker.internal:8000/mcp
      - host: host.docker.internal
        port: 8000
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
          - allow: { method: PUT, path: "/**" }
          - allow: { method: PATCH, path: "/**" }
          - allow: { method: DELETE, path: "/**" }
    binaries:
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/curl }
      - { path: /usr/local/bin/mcp-remote}
