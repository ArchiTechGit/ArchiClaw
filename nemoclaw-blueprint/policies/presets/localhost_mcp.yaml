preset:
  name: localhost_mcp
  description: "Localhost MCP server access, including NetBox"

network_policies:
  localhost_mcp:
    name: localhost_mcp
    endpoints:
      # Netbox MCP server endpoint http://host.docker.internal:8000/mcp
      - host: host.docker.internal
        port: 8000
        access: full
      - host: 172.17.0.1
        port: 8000
        access: full
    binaries:
      - { path: /usr/local/bin/node }
      - { path: /usr/local/bin/npx }
      - { path: /usr/bin/curl }
      - { path: /usr/local/bin/mcp-remote}
