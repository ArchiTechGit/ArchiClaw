preset:
  name: thousandeyes
  description: "Cisco ThousandEyes website, docs, and MCP/API access"

network_policies:
  thousandeyes:
    name: thousandeyes
    endpoints:
      - host: thousandeyes.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
      - host: developer.cisco.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/docs/thousandeyes/**" }
      # ThousandEyes MCP server endpoint: https://api.thousandeyes.com/mcp
      - host: api.thousandeyes.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
          - allow: { method: PUT, path: "/**" }
          - allow: { method: PATCH, path: "/**" }
          - allow: { method: DELETE, path: "/**" }
    binaries:
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/curl }
      - { path: /usr/local/bin/mcp-remote}
